enum BookingStatus {
  CONFIRMED
  CANCELLED
}

type Booking {
  id: ID!
  resourceId: ID!
  title: String!
  startTime: String!
  endTime: String!
  status: BookingStatus!
  createdAt: String!
  updatedAt: String!
}

input BookingFilter {
  resourceId: ID
  status: BookingStatus
  from: String
  to: String
}

type Resource {
  id: ID!
  name: String!
  capacity: Int!
  createdAt: String!
  bookings: [Booking!]!
}

type Query {
  resources: [Resource!]!
  resource(id: ID!): Resource
  bookings(filter: BookingFilter): [Booking!]!
}

type Mutation {
  createResource(
    name: String!
    capacity: Int!
  ): Resource!

  createBooking(
    resourceId: ID!
    title: String!
    startTime: String!
    endTime: String!
  ): Booking!

  cancelBooking(id: ID!): Booking!
}