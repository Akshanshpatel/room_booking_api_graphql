enum BookingStatus {
  CONFIRMED
  CANCELLED
}

type Booking {
  id: ID!
  resourceId: ID!
  title: String!
  startTime: String!
  endTime: String!
  status: BookingStatus!
  createdAt: String!
  updatedAt: String!
}

type PageInfo {
  nextCursor: String
  hasNextPage: Boolean!
}

type BookingConnection {
  items: [Booking!]!
  pageInfo: PageInfo!
}

input BookingFilter {
  resourceId: ID
  status: BookingStatus
  from: String
  to: String
}

type Resource {
  id: ID!
  name: String!
  capacity: Int!
  createdAt: String!
  bookings: [Booking!]!
}

type Query {
  resources: [Resource!]!
  resource(id: ID!): Resource

  bookings(
  filter: BookingFilter
  limit: Int = 10
  cursor: String
  ): BookingConnection!
  
  availability(
    resourceId: ID!
    startTime: String!
    endTime: String!
  ): Availability!
}

type Availability {
  resourceId: ID!
  startTime: String!
  endTime: String!
  available: Boolean!
}

type Mutation {
  createResource(
    name: String!
    capacity: Int!
  ): Resource!

  createBooking(
    resourceId: ID!
    title: String!
    startTime: String!
    endTime: String!
  ): Booking!

  cancelBooking(id: ID!): Booking!

  rescheduleBooking(
  id: ID!
  startTime: String!
  endTime: String!
  ): Booking!

  deleteBooking(id: ID!): Boolean!
}
